name: Kepler Communications
description: Kepler Communications operates a cloud-based infrastructure network in space, delivering real-time
  connectivity, on-orbit edge compute, and hosted payload services for satellite operators and space missions.
  Its offerings include the Kepler Network for space-based data relay and communications, Kepler Compute for
  on-orbit processing, and hosted payload services that reduce the cost and technical complexity of operating
  in orbit. Kepler is backed by Canaan Partners, Costanoa Ventures, and Techstars. No public developer API,
  OpenAPI specification, or SDK has been identified; services are accessed through the Kepler customer portal
  and an Atlassian-hosted support service desk.
